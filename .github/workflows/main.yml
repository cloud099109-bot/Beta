name: Build Seraph Hack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Display repo root
        run: |
          echo "=== Repo root contents ==="
          ls -la

      - name: Extract and verify archive
        run: |
          if [ ! -f seraphhack-1.2.0.zip ]; then
            echo "❌ ERROR: seraphhack-1.2.0.zip not found"
            ls -la
            exit 1
          fi
          echo "✅ Archive found, extracting..."
          rm -rf project
          mkdir project
          unzip -q seraphhack-1.2.0.zip -d project
          echo "✅ Extraction complete"

      - name: List extracted project structure
        run: |
          echo "=== Project structure ==="
          find project -maxdepth 3 -type f | head -30
          find project -maxdepth 3 -type d

      - name: Locate Gradle project
        run: |
          proj=$(find project -maxdepth 6 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | head -n1 || true)
          if [ -z "$proj" ]; then
            echo "❌ ERROR: No build.gradle found in project/"
            find project -maxdepth 6 -type d
            exit 1
          fi
          echo "✅ Gradle project found at: $proj"
          echo "PROJECT_DIR=$proj" >> $GITHUB_ENV

      - name: Setup Java for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Remove incomplete Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          echo "=== Removing incomplete wrapper ==="
          rm -rf gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat 2>/dev/null || true
          echo "✅ Old wrapper removed"

      - name: Generate complete Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          echo "=== Generating new wrapper with Gradle 8.8 ==="
          gradle wrapper --gradle-version 8.8
          echo "✅ Complete wrapper generated"
          echo ""
          echo "=== Verifying wrapper files ==="
          ls -lah gradle/wrapper/
          ls -lah gradlew*

      - name: Set executable permissions
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          [ -f gradlew.bat ] && chmod +x gradlew.bat || true
          echo "✅ Permissions set"

      - name: Verify Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          echo "=== Testing gradlew ==="
          ./gradlew --version
          echo "✅ Gradle wrapper verified"

      - name: Build Minecraft mod
        run: |
          cd "$PROJECT_DIR"
          echo "=== Starting build ==="
          ./gradlew clean build --no-daemon -x test
          echo "✅ Build completed"

      - name: List build artifacts
        run: |
          echo "=== Build artifacts ==="
          find project -path "*/build/libs/*.jar" -type f 2>/dev/null && echo "✅ JAR files found" || echo "⚠️ No JAR files found yet"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeraphHack-1.2.0
          path: project/**/build/libs/*.jar
          if-no-files-found: warn

      - name: Build summary
        if: success()
        run: |
          echo "✅ Build succeeded!"
          echo "Artifacts have been uploaded"

      - name: Build failed - Show logs
        if: failure()
        run: |
          echo "❌ Build failed"
          echo ""
          echo "=== Checking build reports ==="
          find project -path "*/build/reports" -type f 2>/dev/null | head -20 || echo "No reports found"
          echo ""
          echo "=== Last 50 lines of build.log ==="
          find project -path "*/build/logs/build.log" -exec tail -50 {} \; 2>/dev/null || echo "No build.log found"
