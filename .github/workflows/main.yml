name: Build Seraph Hack

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew clean build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: seraphhack
          path: build/libs/*.jar
          if-no-files-found: error
