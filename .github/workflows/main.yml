name: Build Seraph Hack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Display repo root
        run: |
          echo "=== Repo root contents ==="
          ls -la

      - name: Extract and verify archive
        run: |
          if [ ! -f seraphhack-1.2.0.zip ]; then
            echo "❌ ERROR: seraphhack-1.2.0.zip not found"
            ls -la
            exit 1
          fi
          echo "✅ Archive found, extracting..."
          rm -rf project
          mkdir project
          unzip -q seraphhack-1.2.0.zip -d project
          echo "✅ Extraction complete"

      - name: List extracted project structure
        run: |
          echo "=== Project structure ==="
          find project -maxdepth 3 -type f | head -30
          find project -maxdepth 3 -type d

      - name: Locate Gradle project
        run: |
          proj=$(find project -maxdepth 6 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | head -n1 || true)
          if [ -z "$proj" ]; then
            echo "❌ ERROR: No build.gradle found in project/"
            find project -maxdepth 6 -type d
            exit 1
          fi
          echo "✅ Gradle project found at: $proj"
          echo "PROJECT_DIR=$proj" >> $GITHUB_ENV

      - name: Setup Gradle with wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          gradle-home-cache-cleanup: true

      - name: Debug - Check for gradlew in extracted project
        run: |
          cd "$PROJECT_DIR"
          echo "=== Checking for existing gradlew ==="
          ls -la | grep -E "gradlew|gradle" || echo "No gradle files found"
          echo ""
          echo "=== Project root files ==="
          ls -la

      - name: Generate Gradle wrapper if missing
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ]; then
            echo "⚠️ gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.8
            ls -la | grep -E "gradlew|gradle"
          else
            echo "✅ gradlew already exists"
            ./gradlew --version
          fi

      - name: Make gradlew executable
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          [ -f gradlew.bat ] && chmod +x gradlew.bat || true
          echo "✅ Permissions set"

      - name: Verify gradlew works
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build Minecraft mod
        run: |
          cd "$PROJECT_DIR"
          echo "=== Starting build ==="
          ./gradlew clean build --no-daemon
          echo "✅ Build completed"

      - name: List build artifacts
        run: |
          echo "=== Build artifacts ==="
          find project -path "*/build/libs/*.jar" -type f || echo "No JAR files found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeraphHack-1.2.0
          path: project/**/build/libs/*.jar
          if-no-files-found: warn

      - name: Build summary
        if: success()
        run: echo "✅ Build succeeded"

      - name: Build failed - Show logs
        if: failure()
        run: |
          echo "❌ Build failed"
          find project -path "*/build/reports" -type f 2>/dev/null | head -20 || echo "No reports found"
