name: Build Seraph Hack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Seraph project
        run: |
          rm -rf project
          mkdir project
          unzip -q seraphhack-1.2.0.zip -d project

      - name: Show project files
        run: |
          find project -maxdepth 5 -type f | sort

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find Gradle project
        run: |
          echo "Searching for build.gradle..."
          find project -name build.gradle -o -name build.gradle.kts

      - name: Build Minecraft mod
        working-directory: project/examplemod
        run: |
          gradle clean build --no-daemon

      - name: Show build output
        run: |
          find project/examplemod/build/libs -maxdepth 1 -type f -print

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SeraphHack-1.2.0
          path: project/examplemod/build/libs/*.jar
          if-no-files-found: error
